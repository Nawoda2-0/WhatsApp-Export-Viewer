<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="System architecture"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2aa781"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f8fbfa"/><rect x="0" width="100%" height="10" fill="#009b77"/><text x="52" y="69" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#163d33">System architecture</text><g font-family="Arial,sans-serif"><rect x="58" y="118" width="270" height="84" rx="17" fill="#f1f7f5" stroke="#c4dcd2" stroke-width="1.6"/><text x="193.0" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#102e28">User / Browser</text><text x="193.0" y="177" text-anchor="middle" font-size="13" fill="#536d65">Local file access</text><rect x="465" y="118" width="270" height="84" rx="17" fill="#f1f7f5" stroke="#c4dcd2" stroke-width="1.6"/><text x="600.0" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#102e28">Presentation layer</text><text x="600.0" y="177" text-anchor="middle" font-size="13" fill="#536d65">HTML + CSS</text><rect x="870" y="118" width="270" height="84" rx="17" fill="#f1f7f5" stroke="#c4dcd2" stroke-width="1.6"/><text x="1005.0" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#102e28">Application layer</text><text x="1005.0" y="177" text-anchor="middle" font-size="13" fill="#536d65">Vanilla JavaScript</text><path d="M328 160 L465 160" fill="none" stroke="#2aa781" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M735 160 L870 160" fill="none" stroke="#2aa781" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="58" y="322" width="250" height="84" rx="17" fill="#f1f7f5" stroke="#c4dcd2" stroke-width="1.6"/><text x="183.0" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#102e28">TXT parser</text><text x="183.0" y="381" text-anchor="middle" font-size="13" fill="#536d65"